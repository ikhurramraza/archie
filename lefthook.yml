skip_output:
  - meta
  - summary
  - success
  - execution

pre-commit:
  parallel: true
  commands:
    shfmt:
      files: git diff --name-only --cached home/dot_zshenv home/dot_config/zsh/ home/dot_config/tmux/scripts/ home/dot_local/scripts/
      exclude: "dot_zshrc"
      run: shfmt -i=2 -d {files}

    stylua:
      files: git diff --name-only --cached *.lua
      run: stylua --config-path home/dot_config/stylua/stylua.toml --check {files}
