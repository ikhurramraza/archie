[".config/zsh/.oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
    clone.args = ["--depth=1"]
    pull.args = ["--ff-only"]

# bol carried `ignore = dirty` as a submodule: it's my own plugin and may hold
# local edits. refreshPeriod deliberately omitted (0 = never auto-pulled);
# update manually with: git -C ~/.config/zsh/oh-my-zsh-custom/plugins/bol pull
[".config/zsh/oh-my-zsh-custom/plugins/bol"]
    type = "git-repo"
    url = "https://github.com/ikhurramraza/bol.git"

# Pinned to the exact commit the old submodule referenced; bump by editing the URL.
[".config/nvim/sneaps"]
    type = "archive"
    url = "https://github.com/rafamadriz/friendly-snippets/archive/efff286dd74c22f731cdec26a70b46e5b203c619.tar.gz"
    exact = true
    stripComponents = 1
